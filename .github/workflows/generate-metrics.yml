name: Generate Profile Metrics

on:
  schedule:
    # Runs at 18:00 UTC every day
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Metrics
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate 3D Contribution Calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            Assets/github-contribution-grid-snake.svg
            Assets/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Repository Count Badge
        run: |
          TOKEN="${{ secrets.PAT_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi

          if [ "$TOKEN" == "${{ secrets.GITHUB_TOKEN }}" ]; then
            REPOS=$(curl -s -H "Authorization: token $TOKEN" https://api.github.com/users/inkesk-dozing | jq '.public_repos // 0')
          else
            USER_DATA=$(curl -s -H "Authorization: token $TOKEN" https://api.github.com/user)
            PUBLIC_REPOS=$(echo "$USER_DATA" | jq '.public_repos // 0')
            PRIVATE_REPOS=$(echo "$USER_DATA" | jq '.total_private_repos // 0')
            REPOS=$((PUBLIC_REPOS + PRIVATE_REPOS))
          fi

          echo "Total repositories: $REPOS"
          mkdir -p Assets
          curl -s "https://img.shields.io/badge/REPOSITORIES-${REPOS}-d4b23c?style=for-the-badge&labelColor=0d1117" -o Assets/repositories.svg

      - name: Generate Streak Stats SVG
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          options: user=inkesk-dozing&background=135,000000,441350&fire=ffeb95&ring=ffeb95&sideNums=ffffff&sideLabels=ffffff&dates=c56a90&currStreakNum=ffffff&currStreakLabel=c56a90&hide_border=true
          path: Assets/streak-stats.svg

      - name: Move 3D Calendar to Assets
        run: |
          mkdir -p Assets
          rm -rf Assets/profile-3d-contrib
          mv profile-3d-contrib Assets/ || true

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ../temp_assets
          cp -r Assets/* ../temp_assets/
          git checkout --orphan metrics
          git rm -rf .
          mkdir -p Assets
          cp -r ../temp_assets/* Assets/
          git add Assets/
          git commit -m "chore: regenerate profile metrics"
          git push origin metrics --force
