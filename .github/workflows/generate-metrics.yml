name: Generate Profile Metrics

on:
  schedule:
    # Runs at 18:00 UTC every day
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Metrics
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate 3D Contribution Calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            Assets/github-contribution-grid-snake.svg
            Assets/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Repository Count Badge
        run: |
          TOKEN="${{ secrets.PAT_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi

          if [ "$TOKEN" == "${{ secrets.GITHUB_TOKEN }}" ]; then
            REPOS=$(curl -s -H "Authorization: token $TOKEN" https://api.github.com/users/inkesk-dozing | jq '.public_repos // 0')
          else
            USER_DATA=$(curl -s -H "Authorization: token $TOKEN" https://api.github.com/user)
            PUBLIC_REPOS=$(echo "$USER_DATA" | jq '.public_repos // 0')
            PRIVATE_REPOS=$(echo "$USER_DATA" | jq '.total_private_repos // 0')
            REPOS=$((PUBLIC_REPOS + PRIVATE_REPOS))
          fi

          echo "Total repositories: $REPOS"
          mkdir -p Assets
          curl -s "https://img.shields.io/badge/REPOSITORIES-${REPOS}-d4b23c?style=for-the-badge&labelColor=0d1117" -o Assets/repositories.svg
          
      - name: Generate Streak Stats SVG
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          options: user=inkesk-dozing&background=135,000000,441350&fire=ffeb95&ring=ffeb95&sideNums=ffffff&sideLabels=ffffff&dates=c56a90&currStreakNum=ffffff&currStreakLabel=c56a90&hide_border=true
          path: Assets/streak-stats.svg

      - name: Generate Stats and Language Cards with Fallback
        run: |
          URL_STATS_PRIMARY="https://github-readme-stats.vercel.app/api?username=inkesk-dozing&count_private=true&show_icons=true&bg_color=0,000000,441350&title_color=c56a90&text_color=ffffff&icon_color=ffeb95&show=reviews,discussions_started,discussions_answered,prs_merged,prs_merged_percentage&custom_title=inkesk's%20GitHub%20Stats&include_all_commits=false&hide_border=true"
          URL_STATS_FALLBACK="https://github-stats-extended.vercel.app/api?username=inkesk-dozing&count_private=true&show_icons=true&bg_color=0,000000,441350&title_color=c56a90&text_color=ffffff&icon_color=ffeb95&show=reviews,discussions_started,discussions_answered,prs_merged,prs_merged_percentage&custom_title=inkesk's%20GitHub%20Stats&include_all_commits=false&hide_border=true"
          
          URL_LANGS_PRIMARY="https://github-readme-stats.vercel.app/api/top-langs/?username=inkesk-dozing&layout=compact&langs_count=6&bg_color=0,000000,441350&title_color=c56a90&text_color=ffffff&icon_color=ffeb95&hide_border=true"
          URL_LANGS_FALLBACK="https://github-stats-extended.vercel.app/api/top-langs/?username=inkesk-dozing&layout=compact&langs_count=6&bg_color=0,000000,441350&title_color=c56a90&text_color=ffffff&icon_color=ffeb95&hide_border=true"

          mkdir -p Assets

          download_with_fallback() {
            local primary_url="$1"
            local fallback_url="$2"
            local output_path="$3"
            local temp_file="${output_path}.tmp"

            echo "Attempting to download from primary: $primary_url"
            if curl -s -f -L -m 15 "$primary_url" -o "$temp_file" && grep -q "<svg" "$temp_file"; then
              mv "$temp_file" "$output_path"
              echo "Successfully downloaded from primary."
              return 0
            fi

            echo "Primary failed. Attempting fallback: $fallback_url"
            if curl -s -f -L -m 15 "$fallback_url" -o "$temp_file" && grep -q "<svg" "$temp_file"; then
              mv "$temp_file" "$output_path"
              echo "Successfully downloaded from fallback."
              return 0
            fi

            echo "Fallback failed. Checking local file."
            rm -f "$temp_file"
            if [ -f "$output_path" ]; then
              echo "Keeping existing SVG file: $output_path"
              return 0
            fi

            local remote_history_url="https://raw.githubusercontent.com/inkesk-dozing/inkesk-dozing/metrics/$output_path"
            echo "Attempting to retrieve last successful SVG from remote: $remote_history_url"
            if curl -s -f -L -m 15 "$remote_history_url" -o "$temp_file" && grep -q "<svg" "$temp_file"; then
              mv "$temp_file" "$output_path"
              echo "Successfully restored from remote metrics branch."
              return 0
            fi

            echo "Restoration failed. Creating custom placeholder SVG."
            echo "" | base64 -d > "$output_path"
            return 0
          }

          download_with_fallback "$URL_STATS_PRIMARY" "$URL_STATS_FALLBACK" "Assets/github-stats.svg"
          download_with_fallback "$URL_LANGS_PRIMARY" "$URL_LANGS_FALLBACK" "Assets/top-languages.svg"

      - name: Process Monotonic Profile Views Counter & State Storage
        run: |
          mkdir -p Assets
          
          BASE_OFFSET=${{ secrets.VIEW_COUNTER_OFFSET || 270 }}

          PREV_COUNT=0
          REMOTE_JSON_URL="https://raw.githubusercontent.com/inkesk-dozing/inkesk-dozing/metrics/Assets/views_data.json"
          if curl -s -f -L -m 10 "$REMOTE_JSON_URL" -o temp_views.json 2>/dev/null; then
            PREV_COUNT=$(jq '.count // 0' temp_views.json 2>/dev/null || echo 0)
          fi
          rm -f temp_views.json

          LIVE_COUNT=0
          KOMAREV_SVG=$(curl -s -f -L -m 10 "https://komarev.com/ghpvc/?username=inkesk-dozing" || true)
          if [ -n "$KOMAREV_SVG" ]; then
            EXTRACTED=$(echo "$KOMAREV_SVG" | grep -oP '(?<=<text[^>]*>)[0-9]+(?=</text>)' | tail -n 1 || echo 0)
            LIVE_COUNT=${EXTRACTED:-0}
          fi

          TOTAL_COUNT=$PREV_COUNT
          if [ "$LIVE_COUNT" -gt "$TOTAL_COUNT" ]; then
            TOTAL_COUNT=$LIVE_COUNT
          fi

          FINAL_COUNT=$((TOTAL_COUNT + BASE_OFFSET))

          cat <<EOF > Assets/views_data.json
          {
            "count": $TOTAL_COUNT,
            "base_offset": $BASE_OFFSET,
            "display_count": $FINAL_COUNT,
            "updated_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

          curl -s "https://img.shields.io/badge/PROFILE%20VIEWS-${FINAL_COUNT}-d4b23c?style=for-the-badge&labelColor=0d1117" -o Assets/profile-views.svg

      - name: Move 3D Calendar to Assets
        run: |
          mkdir -p Assets
          rm -rf Assets/profile-3d-contrib
          mv profile-3d-contrib Assets/ || true

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ../temp_assets
          cp -r Assets/* ../temp_assets/
          git checkout --orphan metrics
          git rm -rf .
          mkdir -p Assets
          cp -r ../temp_assets/* Assets/
          git add Assets/
          git commit -m "chore: regenerate profile metrics"
          git push origin metrics --force
