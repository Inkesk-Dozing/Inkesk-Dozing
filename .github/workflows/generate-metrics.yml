name: Generate Profile Metrics

on:
  schedule:
    # Runs at 18:00 UTC every day
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Metrics
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Recent Activity
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "chore: update recent activity feed"

      - name: Generate 3D Contribution Calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            Assets/github-contribution-grid-snake.svg
            Assets/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Repository Count Badge
        run: |
          TOKEN="${{ secrets.PAT_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi

          if [ "$TOKEN" == "${{ secrets.GITHUB_TOKEN }}" ]; then
            REPOS=$(curl -s -H "Authorization: token $TOKEN" https://api.github.com/users/Inkesk-Dozing | jq '.public_repos // 0')
          else
            USER_DATA=$(curl -s -H "Authorization: token $TOKEN" https://api.github.com/user)
            PUBLIC_REPOS=$(echo "$USER_DATA" | jq '.public_repos // 0')
            PRIVATE_REPOS=$(echo "$USER_DATA" | jq '.total_private_repos // 0')
            REPOS=$((PUBLIC_REPOS + PRIVATE_REPOS))
          fi

          echo "Total repositories: $REPOS"
          mkdir -p Assets
          curl -s "https://img.shields.io/badge/REPOSITORIES-${REPOS}-c56a90?style=for-the-badge&labelColor=0d1117" -o Assets/repositories.svg

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Assets/*.svg profile-3d-contrib/* || true
          git commit -m "chore: regenerate profile metrics (snake, repository count & 3d contribution calendar)" || exit 0
          git pull --rebase origin main || true
          git push
